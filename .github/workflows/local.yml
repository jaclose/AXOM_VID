name: Local renderer verification

on:
  pull_request:
    paths:
      - "local/**"
      - ".github/workflows/local.yml"
  push:
    branches: [main]
    paths:
      - "local/**"
      - ".github/workflows/local.yml"
  workflow_dispatch:

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s local/tests -v
